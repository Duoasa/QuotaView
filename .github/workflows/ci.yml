name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Install release fixture dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install ripgrep
          rg --version

      - name: Run synthetic release script fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 Tests/BuildScripts/AuditBuildReleaseSmoke.py

      - name: Run native question closure contract fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 Prototypes/NativeQuestionBridgeContract/smoke.py


  xcode-smoke:
    name: Native App and Widget build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require macOS 26 SDK
        run: |
          xcodebuild -version
          xcrun swift --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26

      - name: Build shared Test graph without launching the app
        run: |
          xcodebuild -project QuotaView.xcodeproj -scheme QuotaView \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/QuotaView-TestGraph" \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing

      - name: Build native Release graph without signing
        run: |
          xcodebuild -project QuotaView.xcodeproj -scheme QuotaView \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/QuotaView-ReleaseGraph" \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Verify packaged resources and embedded targets
        env:
          QV_BUILD_PRODUCTS: ${{ runner.temp }}/QuotaView-ReleaseGraph/Build/Products/Release
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          products = Path(os.environ['QV_BUILD_PRODUCTS'])
          app = products / 'QuotaView.app/Contents'
          widget = app / 'PlugIns/QuotaViewWidgetExtension.appex/Contents'
          # AUDIT-025: BEGIN RESOURCE INVENTORY
          required = [app / 'MacOS/QuotaView', app / 'Helpers/QuotaViewActivityHook',
                      widget / 'MacOS/QuotaViewWidgetExtension',
                      app / 'Frameworks/QuotaViewCore.framework/QuotaViewCore',
                      app / 'Frameworks/QuotaViewWidgetContract.framework/QuotaViewWidgetContract',
                      app / 'Frameworks/QuotaViewActivityHookSupport.framework/QuotaViewActivityHookSupport']
          for bundle in [app, widget]:
              required.append(bundle / 'Resources/Assets.car')
              required += [bundle / 'Resources/Fonts' / (face + '.ttf')
                           for face in ['AstaSans-Regular', 'AstaSans-Medium', 'AstaSans-SemiBold']]
          required += [app / 'Resources' / name for name in
                       ['CodexProviderIcon.png', 'CodexActivityRippleGlowShader.txt', 'QuotaViewFeedbackQQ.jpg']]
          required += [app / 'Resources/CodexAgentAvatars' / f'CodexSubagentAvatar-{index}.png'
                       for index in range(28)]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit('Missing packaged resources/targets:\n' + '\n'.join(missing))
          # AUDIT-025: END RESOURCE INVENTORY
          print(f'Verified {len(required)} native resources/targets')
          PY
