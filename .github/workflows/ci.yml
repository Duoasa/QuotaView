name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: App and release checks
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Run App Store release script tests
        run: |
          zsh Tests/ReleaseScripts/test-appstore-gate-statuses.zsh
          zsh Tests/ReleaseScripts/test-appstore-metadata.zsh
          zsh Tests/ReleaseScripts/test-appstore-privacy-manifest.zsh
          zsh Tests/ReleaseScripts/test-appstore-url-security.zsh

      - name: Check App Store readiness
        run: scripts/check-appstore-readiness.sh
