name: Feature request
description: Propose a focused improvement to QuotaView
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this change improve?
      placeholder: "When I ..., I need ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. How do you handle this today?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Menu bar
        - Popover
        - Settings
        - Codex compatibility
        - Usage data
        - Notifications
        - Accessibility
        - Localization
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not require posting or storing authentication credentials.
          required: true
