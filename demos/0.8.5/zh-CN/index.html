<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="应用界面来自 macOS 实机采集，菜单栏、标识与字幕经过后期合成；任务原文保留原语言。演示未使用重置卡。">
  <title>QuotaView 实机演示</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d1117; color: #f0f6fc; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1104px; margin: 0 auto; padding: 40px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.2; margin: 0 0 8px; }
    p { margin: 0; color: #b1bac4; }
    video { display: block; width: 100%; aspect-ratio: 8 / 5; border-radius: 14px; border: 1px solid #30363d; background: #000; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin: 20px 0; }
    a { color: #9acbff; text-underline-offset: 4px; }
    a:hover { color: #d0e7ff; }
    button { border: 1px solid #58a6ff; border-radius: 8px; padding: 10px 20px; background: #1f6feb; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #388bfd; }
    :focus-visible { outline: 3px solid #d0e7ff; outline-offset: 4px; }
    .caption { font-size: 13px; max-width: 80ch; }
    #playback-error { color: #ffa198; margin-top: 12px; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) { main { padding: 24px 16px; } header { align-items: flex-start; } video { border-radius: 8px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>QuotaView 实机演示</h1><p>中文版 · 1:15</p></div>
      <a href="../en/" lang="en">English</a>
    </header>
    <video id="demo" controls playsinline preload="metadata" poster="poster.jpg" aria-label="QuotaView 实机演示">
      <source src="QuotaView-demo-zh-CN.mp4" type="video/mp4">
      <a href="QuotaView-demo-zh-CN.mp4">下载 MP4</a>
    </video>
    <p id="playback-error" role="status" hidden>视频暂时无法播放，可以使用下方链接下载 MP4。</p>
    <nav aria-label="视频操作">
      <button id="play-toggle" type="button" aria-controls="demo" hidden>播放视频</button>
      <a href="QuotaView-demo-zh-CN.mp4" download>下载 MP4</a>
      <a href="https://github.com/Duoasa/QuotaView/blob/main/README.zh-CN.md">中文 README</a>
    </nav>
    <p class="caption">应用界面来自 macOS 实机采集，菜单栏、标识与字幕经过后期合成；任务原文保留原语言。演示未使用重置卡。</p>
  </main>
  <script>
    const video = document.getElementById('demo');
    const toggle = document.getElementById('play-toggle');
    const error = document.getElementById('playback-error');
    toggle.hidden = false;
    toggle.addEventListener('click', async () => {
      if (!video.paused) { video.pause(); return; }
      error.hidden = true;
      try { await video.play(); } catch (_) { error.hidden = false; }
    });
    video.addEventListener('play', () => { toggle.textContent = "暂停视频"; });
    video.addEventListener('pause', () => { toggle.textContent = "播放视频"; });
    video.addEventListener('ended', () => { toggle.textContent = "重新播放"; });
    video.addEventListener('error', () => { error.hidden = false; });
  </script>
</body>
</html>
